name: Build Packages

on:
  push:
    branches: [v2.0, main]
    paths:
      - "cbench/python/**"
      - ".github/workflows/package.yml"
      - ".github/workflows/package-build.yml"
  release:
    types: [published]
  workflow_dispatch:
# Pull requests build packages through ci.yml (the CI / ci-ok gate), which
# calls package-build.yml.

# Least privilege for GITHUB_TOKEN; a job that needs more asks for it
# (attach-to-release: contents: write).
permissions:
  contents: read

jobs:
  # man pages, fpm rpm/deb, native RPM and DEB
  build:
    uses: ./.github/workflows/package-build.yml

  # -------------------------------------------------------------------------
  # Sign all RPMs with the project GPG key (release builds only).
  # Mirrors the signing pattern used in Scale-GUInstall.
  # -------------------------------------------------------------------------
  sign-rpm:
    name: Sign RPMs
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Install rpmsign
        run: sudo apt-get install -y --no-install-recommends rpm

      - name: Download fpm RPM
        uses: actions/download-artifact@v4
        with:
          name: cbench-fpm-rpm
          path: dist/

      - name: Download native RPM
        uses: actions/download-artifact@v4
        with:
          name: cbench-native-rpm
          path: dist/

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null \
            | grep "^sec" | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          printf '%%_gpg_name %s\n%%__gpg /usr/bin/gpg\n%%__gpg_sign_cmd %%{__gpg} gpg --batch --no-verbose --no-armor --no-secmem-warning -u "%%{_gpg_name}" -sbo %%{__signature_filename} --digest-algo sha256 %%{__plaintext_filename}\n' \
            "$KEY_ID" > ~/.rpmmacros

      - name: Sign RPMs
        run: |
          for rpm in dist/*.rpm; do
            rpmsign --addsign "$rpm"
            echo "Signed: $rpm"
          done

      - name: Verify RPM signatures
        run: |
          rpm --import cbench/python/packaging/RPM-GPG-KEY-cbench
          for rpm in dist/*.rpm; do
            rpm --checksig "$rpm" && echo "OK: $rpm"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cbench-signed-rpms
          path: dist/
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Attach all packages to the release; detect pre-release; clean up old ones.
  # -------------------------------------------------------------------------
  attach-to-release:
    name: Attach packages to release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [sign-rpm, build]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download signed RPMs
        uses: actions/download-artifact@v4
        with:
          name: cbench-signed-rpms
          path: dist/

      - name: Download fpm DEB
        uses: actions/download-artifact@v4
        with:
          name: cbench-fpm-deb
          path: dist/

      - name: Download native DEB
        uses: actions/download-artifact@v4
        with:
          name: cbench-native-deb
          path: dist/

      - name: Copy GPG public key into dist/
        run: cp cbench/python/packaging/RPM-GPG-KEY-cbench dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: dist/**
          prerelease: ${{ contains(github.event.release.tag_name, '-') }}

      - name: Delete old releases (keep newest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --yes --cleanup-tag
            done
