# Pre-commit hooks for the cbench Python toolchain.
# Install:  pip install pre-commit && pre-commit install --install-hooks -t pre-commit -t pre-push
# The Perl toolchain (cbench/*.pl, perllib/) is legacy read-only code and is not linted.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^cbench/python/packaging/
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        files: ^cbench/python/.*\.py$
      - id: trailing-whitespace
        files: ^cbench/python/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check   # "ruff" is a deprecated alias
        files: ^cbench/python/
        args: ["--fix"]

  # same scan and skips as CI (security.yml)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^cbench/python/cbench/
        args: ["-q", "-s", "B101,B404,B603,B607"]

  # shell we ship as-is; job templates are rendered and shellchecked by the
  # test suite instead (they aren't valid shell until rendered)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^cbench/python/packaging/cbench\.wrapper$
        types: [file]
        args: ["-s", "sh"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: pytest-full
        name: full pytest suite (pre-push)
        # Prefer the repo venv, fall back to python3 on PATH. A bare `python`
        # does not exist on macOS or many Linux distros, and the system python3
        # generally has no pytest — so the venv is tried first.
        entry: "bash -c 'PY=$([ -x .venv/bin/python ] && echo .venv/bin/python || echo python3); exec \"$PY\" -m pytest cbench/python/tests/ -q'"
        language: system
        pass_filenames: false
        stages: [pre-push]
