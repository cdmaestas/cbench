# Pre-commit hooks for the cbench Python toolchain.
# Install:  pip install pre-commit && pre-commit install --install-hooks -t pre-commit -t pre-push
# The Perl toolchain (cbench/*.pl, perllib/) is legacy read-only code and is not linted.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^cbench/python/packaging/
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        files: ^cbench/python/.*\.py$
      - id: trailing-whitespace
        files: ^cbench/python/.*\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        files: ^cbench/python/
        args: ["--fix"]

  - repo: local
    hooks:
      - id: pytest-full
        name: full pytest suite (pre-push)
        entry: python -m pytest cbench/python/tests/ -q
        language: system
        pass_filenames: false
        stages: [pre-push]
